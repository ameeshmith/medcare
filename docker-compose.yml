version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medgrid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medgrid_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medgrid_hospital}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medgrid -d medgrid_hospital"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: medgrid_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-medgrid_hospital}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-medgrid}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-medgrid_pass}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:


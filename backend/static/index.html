        box-shadow: 0 0 35px 2px rgba(59, 130, 246, 0.7);

        width: 6px;
        height: 6px;
      }

        background: #050b14;
      }

    <script type="text/babel">
      const { useState, useEffect, useCallback } = React;

      const API_BASE = '/api';
      async function request(path, options = {}) {
        const res = await fetch(`${API_BASE}${path}`, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(
            typeof data.detail === 'string'
              ? data.detail
              : data.detail?.message || 'Request failed'
          );
          err.detail = data.detail;
          throw err;
        }
        return data;
      }

      const api = {
        getOverview: () => request('/dashboard/overview'),
        executeAgent: (message) => request('/agents/execute', { method: 'POST', body: JSON.stringify({ message }) }),
        bookAppointment: (payload) => request('/appointments/book', { method: 'POST', body: JSON.stringify(payload) }),
        rescheduleAppointment: (id, payload) => request(`/appointments/${id}/reschedule`, { method: 'POST', body: JSON.stringify(payload) }),
        cancelAppointment: (id, payload) => request(`/appointments/${id}/cancel`, { method: 'POST', body: JSON.stringify(payload) }),
        resolveApproval: (id, decision, reviewer_note) => request(`/approvals/${id}/resolve`, { method: 'POST', body: JSON.stringify({ decision, reviewer_note }) }),
        queryRag: (query, top_k = 3) => request('/rag/query', { method: 'POST', body: JSON.stringify({ query, top_k }) }),
        generateDailyReport: () => request('/operations/daily-report', { method: 'POST' }),
        triggerN8nReminders: () => request('/n8n/trigger-reminders', { method: 'POST' }),
      };

            {/* 4 SPECIALIST AGENTS - Modern Dark Glassmorphic Mosaic */}

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">

      function AssistantView({ overview, onRefresh }) {
        const [message, setMessage] = useState('');
        const [loading, setLoading] = useState(false);
        const [history, setHistory] = useState([
          {
            sender: 'bot',
            agent: 'CareGrid AI Orchestrator',
            text: "Hello! I am your Autonomous Healthcare Operations Assistant. How can I assist you with clinical appointments, doctor availability, hospital policies, or supervisor approvals today?"
          }
        ]);

        const quickPrompts = [
          "Book Maya with Dr. Elena Vance in Cardiology at 15:00 today",
          "What are the ICU visiting hours and insurance coverage?",
          "Cancel Arthur Pendelton's appointment",
          "Generate today's operations summary"
        ];

        const handleSend = async (customPrompt) => {
          const text = customPrompt || message;
          if (!text.trim() || loading) return;
          
          setHistory(prev => [...prev, { sender: 'user', text }]);
          if (!customPrompt) setMessage('');
          setLoading(true);

          try {
            const res = await api.executeAgent(text);
            setHistory(prev => [
              ...prev,
              {
                sender: 'bot',
                agent: res.active_agent,
                text: res.response,
                requires_approval: res.requires_approval,
                model: res.llm_model_used
              }
            ]);
            onRefresh?.();
          } catch (err) {
            setHistory(prev => [...prev, { sender: 'bot', text: "Error: " + err.message }]);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="max-w-[1200px] mx-auto px-4 sm:px-8 py-8 w-full flex-1 flex flex-col gap-5">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-blue-900/40 pb-3">
              <div>
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-[#facc15] shadow-[0_0_10px_#facc15]" />
                  <span>AI Clinic Operations Dispatch</span>
                </h2>
                <p className="text-xs text-slate-400 font-mono">
                  Natural English &bull; Receptionist-Ready &bull; Groq Llama 3.3 / GPT-OSS
                </p>
              </div>

              {/* Quick Pills */}
              <div className="hidden lg:flex items-center gap-2">
                {quickPrompts.slice(0, 3).map((p, i) => (
                  <button
                    key={i}
                    onClick={() => handleSend(p)}
                    className="text-[11px] font-mono px-3 py-1.5 rounded-lg av-glass-subtle text-slate-300 hover:text-white hover:border-blue-400/50 transition-all cursor-pointer"
                  >
                    {p.length > 32 ? p.slice(0, 32) + '...' : p} &rarr;
                  </button>
                ))}
              </div>
            </div>

            {/* Chat Messages Panel */}
            <div className="av-glass rounded-2xl p-6 flex flex-col justify-between min-h-[500px] flex-1">
              <div className="space-y-4 overflow-y-auto max-h-[520px] pr-2">
                {history.map((msg, i) => (
                  <div
                    key={i}
                    className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div
                      className={`max-w-[85%] sm:max-w-[75%] p-5 rounded-2xl text-sm leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-blue-600 text-white border border-blue-400/40 shadow-lg font-medium'
                          : 'av-glass-subtle border border-blue-500/25 text-slate-200'
                      }`}
                    >
                      {msg.agent && (
                        <div className="flex items-center justify-between text-[11px] font-mono text-blue-300/80 mb-2 pb-1.5 border-b border-white/5">
                          <span className="font-bold flex items-center gap-1.5 text-[#facc15]">
                            <span className="w-1.5 h-1.5 rounded-full bg-[#facc15]" />
                            {msg.agent}
                          </span>
                          {msg.model && <span className="text-slate-400 text-[10px]">{msg.model}</span>}
                        </div>
                      )}
                      <div className="whitespace-pre-line text-sm text-slate-100 leading-relaxed font-normal">
                        {msg.text}
                      </div>

                      {msg.requires_approval && (
                        <div className="mt-4 pt-3 border-t border-white/10 flex items-center justify-between">
                          <span className="text-xs font-bold text-[#facc15] bg-yellow-400/10 px-2.5 py-1 rounded-md border border-yellow-400/30">
                            ⚠️ Supervisor Review Queued
                          </span>
                          <span className="text-xs font-mono text-blue-300">
                            Check Approval Gate Tab &rarr;
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex items-center gap-3 text-xs font-mono text-[#facc15] p-3 av-glass-subtle rounded-xl w-fit">
                    <span className="w-2 h-2 rounded-full bg-[#facc15] animate-ping" />
                    <span>Agent StateGraph is querying PostgreSQL &amp; verifying slots...</span>
                  </div>
                )}
              </div>

              {/* Chat Input */}
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSend();
                }}
                className="mt-4 pt-4 border-t border-white/5 flex gap-3"
              >
                <input
                  type="text"
                  value={message}
                  onChange={(e) => setMessage(e.target.value)}
                  placeholder="Ask to book, cancel, reschedule, check doctor availability, or hospital policy..."
                  className="flex-1 px-4 py-3.5 rounded-xl bg-slate-900/60 border border-blue-500/30 text-white placeholder-slate-400 text-sm focus:outline-none focus:border-[#facc15] transition-colors"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="btn-yellow-glow px-6 py-3.5 rounded-xl text-xs font-mono cursor-pointer"
                >
                  DISPATCH
                </button>
              </form>
            </div>
          </div>
        );
      }

      function SchedulesView({ overview, onRefresh }) {
        const doctors = overview?.doctors || [];
        const appointments = overview?.appointments || [];
        const todayStr = doctors[0]?.slots?.[0]?.date || new Date().toISOString().slice(0, 10);

        const [patientName, setPatientName] = useState('Maya Lin-Kovacs');
        const [patientEmail, setPatientEmail] = useState('maya.kovacs@example.com');
        const [selectedDocId, setSelectedDocId] = useState(doctors[0]?.id || 1);
        const [slotTime, setSlotTime] = useState('15:00');
        const [reason, setReason] = useState('Cardiovascular follow-up');
        const [feedback, setFeedback] = useState(null);

        const handleBook = async (e) => {
          e.preventDefault();
          setFeedback(null);
          try {
            const res = await api.bookAppointment({
              patient_name: patientName,
              patient_email: patientEmail,
              doctor_id: Number(selectedDocId),
              appointment_date: todayStr,
              slot_time: slotTime,
              reason,
              priority: 'ROUTINE',
            });
            setFeedback({
              type: 'success',
              text: `Appointment ${res.appointment_code} booked successfully at ${slotTime}!`
            });
            onRefresh?.();
          } catch (err) {
            setFeedback({
              type: 'error',
              text: err.detail?.message || err.message
            });
          }
        };

        return (
          <div className="max-w-[1400px] mx-auto px-4 sm:px-8 py-8 space-y-8">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-blue-900/50 pb-3">
              <div>
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-blue-500 rounded-full" />
                  <span>Clinical Schedule &amp; Doctor Availability Matrix</span>
                </h2>
                <p className="text-xs text-slate-400 font-mono">
                  PostgreSQL Real-Time Lock &bull; Zero Double-Bookings Guarantee
                </p>
              </div>
              <button
                onClick={() => {
                  api.triggerN8nReminders().then(r => alert(`n8n Dispatched ${r.reminders_dispatched} reminder emails!`));
                }}
                className="btn-blue-glow px-4 py-2 rounded-xl text-xs font-mono cursor-pointer flex items-center gap-2"
              >
                <span>🔔</span>
                <span>DISPATCH PATIENT REMINDERS (n8n)</span>
              </button>
            </div>

            {feedback && (
              <div
                className={`p-4 rounded-xl text-xs font-mono flex items-center justify-between ${
                  feedback.type === 'success'
                    ? 'bg-emerald-500/10 border border-emerald-400/40 text-emerald-300'
                    : 'bg-rose-500/10 border border-rose-400/40 text-rose-300'
                }`}
              >
                <span>{feedback.text}</span>
                <button onClick={() => setFeedback(null)}>✕</button>
              </div>
            )}

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Left 4 Cols: Quick Booking Card */}
              <form onSubmit={handleBook} className="lg:col-span-4 av-glass rounded-2xl p-6 space-y-4">
                <h3 className="text-sm font-bold font-mono text-[#facc15] border-b border-white/5 pb-2">
                  DISPATCH APPOINTMENT
                </h3>

                <div>
                  <label className="block text-[11px] font-mono text-slate-400 mb-1">PATIENT NAME</label>
                  <input
                    type="text"
                    required
                    value={patientName}
                    onChange={e => setPatientName(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-blue-500/30 text-white text-xs font-mono focus:outline-none focus:border-[#facc15]"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-mono text-slate-400 mb-1">PATIENT EMAIL (n8n SMTP)</label>
                  <input
                    type="email"
                    required
                    value={patientEmail}
                    onChange={e => setPatientEmail(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-blue-500/30 text-white text-xs font-mono focus:outline-none focus:border-[#facc15]"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-mono text-slate-400 mb-1">PHYSICIAN</label>
                  <select
                    value={selectedDocId}
                    onChange={e => setSelectedDocId(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-blue-500/30 text-white text-xs font-mono"
                  >
                    {doctors.map(d => (
                      <option key={d.id} value={d.id}>
                        {d.full_name} ({d.department})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-mono text-slate-400 mb-1">TIME SLOT</label>
                    <select
                      value={slotTime}
                      onChange={e => setSlotTime(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-blue-500/30 text-white text-xs font-mono"
                    >
                      {['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00'].map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono text-slate-400 mb-1">DATE</label>
                    <div className="px-3.5 py-2.5 rounded-lg bg-slate-900/60 border border-white/10 text-slate-300 text-xs font-mono">
                      {todayStr}
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-[11px] font-mono text-slate-400 mb-1">REASON / NOTES</label>
                  <input
                    type="text"
                    value={reason}
                    onChange={e => setReason(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-blue-500/30 text-white text-xs focus:outline-none focus:border-[#facc15]"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full btn-yellow-glow py-3 rounded-xl text-xs font-mono cursor-pointer mt-2"
                >
                  VERIFY &amp; CONFIRM BOOKING
                </button>
              </form>

              {/* Right 8 Cols: Doctors Matrix */}
              <div className="lg:col-span-8 space-y-4">
                <div className="flex items-center justify-between text-xs font-mono text-slate-400">
                  <span>DOCTOR SCHEDULE ({todayStr})</span>
                  <div className="flex items-center gap-4">
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400" /> Open</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-500" /> Booked</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-rose-500" /> Blocked</span>
                  </div>
                </div>

                {doctors.map(doc => (
                  <div key={doc.id} className="av-glass rounded-2xl p-4 border border-blue-900/40 space-y-2">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <div>
                        <span className="font-bold text-white text-sm">{doc.full_name}</span>
                        <span className="ml-2 text-blue-400">&bull; {doc.department}</span>
                      </div>
                      <span className="text-slate-400 text-[11px]">{doc.shift_hours}</span>
                    </div>

                    <div className="grid grid-cols-7 gap-2 pt-1">
                      {(doc.slots || []).filter(s => s.date === todayStr).map(slot => (
                        <button
                          key={slot.id}
                          onClick={() => {
                            setSelectedDocId(doc.id);
                            setSlotTime(slot.time);
                          }}
                          className={`py-2 rounded-xl text-xs font-mono border transition-all cursor-pointer ${
                            slot.is_blocked
                              ? 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                              : slot.is_booked
                              ? 'bg-blue-600/30 border-blue-400/40 text-blue-200'
                              : 'bg-emerald-500/10 border-emerald-400/30 text-emerald-300 hover:bg-emerald-500/20'
                          }`}
                        >
                          <div>{slot.time}</div>
                          <div className="text-[9px] opacity-75">
                            {slot.is_blocked ? 'BLOCKED' : slot.is_booked ? 'BOOKED' : 'OPEN'}
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      function ApprovalsView({ overview, onRefresh }) {
        const approvals = (overview?.approvals || []).filter(a => a.status === 'PENDING');

        const handleAction = async (id, decision) => {
          try {
            await api.resolveApproval(id, decision, 'Authorized by Supervisor');
            onRefresh?.();
          } catch (e) {
            alert(e.message);
          }
        };

        return (
          <div className="max-w-[1200px] mx-auto px-4 sm:px-8 py-8 space-y-6">
            <div className="flex items-center justify-between border-b border-blue-900/50 pb-3">
              <div>
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-[#facc15] rounded-full shadow-[0_0_10px_#facc15]" />
                  <span>Human-in-the-Loop Approval Gate</span>
                </h2>
                <p className="text-xs text-slate-400 font-mono">
                  Emergency triage overrides and critical cancellations hold here for clinical review.
                </p>
              </div>
              <span className="px-3 py-1 rounded-full yellow-pill text-xs font-mono font-bold">
                {approvals.length} Awaiting Authorization
              </span>
            </div>

            {approvals.length === 0 ? (
              <div className="av-glass rounded-2xl p-12 text-center text-slate-400 font-mono text-xs">
                &check; Zero pending tickets. All clinical operations are approved and moving.
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {approvals.map(apr => (
                  <div key={apr.id} className="av-glass rounded-2xl p-6 border border-yellow-400/40 space-y-4">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="px-2.5 py-1 rounded-md bg-yellow-400/20 text-[#facc15] font-bold">
                        {apr.code} &bull; {apr.operation_type}
                      </span>
                      <span className="text-rose-400 font-bold">{apr.risk_level} RISK</span>
                    </div>

                    <p className="text-sm text-slate-100 leading-relaxed font-medium">
                      {apr.summary}
                    </p>

                    <div className="flex gap-3 pt-2">
                      <button
                        onClick={() => handleAction(apr.id, 'APPROVED')}
                        className="flex-1 btn-yellow-glow py-2.5 rounded-xl text-xs font-mono cursor-pointer"
                      >
                        APPROVE &amp; DISPATCH
                      </button>
                      <button
                        onClick={() => handleAction(apr.id, 'REJECTED')}
                        className="flex-1 av-glass hover:bg-rose-900/30 text-rose-300 border border-rose-500/40 py-2.5 rounded-xl text-xs font-mono cursor-pointer"
                      >
                        REJECT
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function KnowledgeView() {
        const [query, setQuery] = useState('What are the ICU visiting hours and insurance coverage?');
        const [results, setResults] = useState([]);

        useEffect(() => {
          api.queryRag(query, 3).then(r => setResults(r.results || []));
        }, []);

        return (
          <div className="max-w-[1200px] mx-auto px-4 sm:px-8 py-8 space-y-6">
            <div className="flex items-center justify-between border-b border-blue-900/50 pb-3">
              <div>
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-sky-400 rounded-full" />
                  <span>Clinical Policy &amp; RAG Knowledge Studio</span>
                </h2>
                <p className="text-xs text-slate-400 font-mono">
                  ChromaDB Vector Embeddings &bull; PyMuPDF Handbook Extractor
                </p>
              </div>
            </div>

            <div className="flex gap-3">
              <input
                type="text"
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Search hospital policies, ICU rules, departments..."
                className="flex-1 px-4 py-3 rounded-xl bg-slate-900/70 border border-blue-500/30 text-white text-xs font-mono focus:outline-none focus:border-[#facc15]"
              />
              <button
                onClick={() => api.queryRag(query, 3).then(r => setResults(r.results || []))}
                className="btn-yellow-glow px-6 py-3 rounded-xl text-xs font-mono cursor-pointer"
              >
                QUERY VECTOR STORE
              </button>
            </div>

            <div className="grid grid-cols-1 gap-4">
              {results.map((res, i) => (
                <div key={i} className="av-glass rounded-2xl p-5 border border-blue-500/25 space-y-2">
                  <div className="flex justify-between items-center text-xs font-mono text-[#facc15]">
                    <span className="font-bold">{res.category} ({res.source} p.{res.page})</span>
                    <span className="text-slate-400 text-[10px]">Relevance: {res.similarity}</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-200 leading-relaxed font-normal">
                    {res.content}
                  </p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function App() {
        const [activeTab, setActiveTab] = useState('landing');
        const [overview, setOverview] = useState(null);

        const fetchOverview = useCallback(async () => {
          try {
            const data = await api.getOverview();
            setOverview(data);
          } catch (e) {
            console.error(e);
          }
        }, []);

        useEffect(() => {
          fetchOverview();
        }, [fetchOverview]);

        return (
          <div className="min-h-screen flex flex-col justify-between">
            <Navbar activeTab={activeTab} setActiveTab={setActiveTab} overview={overview} />
            <main className="flex-1 flex flex-col">
              {activeTab === 'landing' && <LandingView overview={overview} onNavigate={setActiveTab} />}
              {activeTab === 'assistant' && <AssistantView overview={overview} onRefresh={fetchOverview} />}
              {activeTab === 'schedules' && <SchedulesView overview={overview} onRefresh={fetchOverview} />}
              {activeTab === 'approvals' && <ApprovalsView overview={overview} onRefresh={fetchOverview} />}
              {activeTab === 'knowledge' && <KnowledgeView />}
            </main>

            <footer className="w-full border-t border-blue-900/30 py-4 px-6 text-center text-slate-500 text-xs font-mono">
              CareGrid AI &bull; Autonomous Healthcare Operations &bull; Built with LangGraph, Groq, FastAPI, and n8n
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
